name: Daily menu scrape

on:
  schedule:
    - cron: "7 13 * * *"   # 6 AM Los Angeles, daylight time
    - cron: "7 14 * * *"   # 6 AM standard time / 7 AM daylight time
    - cron: "7 16 * * *"   # backstop: 9 AM daylight, 8 AM standard
  workflow_dispatch: {}     # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scrape menus
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scrape.py --force
          else
            python scrape.py
          fi
      - name: Estimate nutrition for new dishes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python nutrition.py
      - name: Commit new data
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Menus for $(date -u +%F)"
          git pull --rebase
          git push
