name: Daily menu scrape

on:
  schedule:
    - cron: "0 13 * * *"  # 6 AM Los Angeles during daylight time
    - cron: "0 14 * * *"  # 6 AM Los Angeles during standard time
  workflow_dispatch: {}     # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scrape menus
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scrape.py --force
          else
            python scrape.py
          fi
      - name: Look up nutrition for new dishes
        env:
          FDC_API_KEY: ${{ secrets.FDC_API_KEY }}
        run: python nutrition.py
      - name: Commit new data
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Menus for $(date -u +%F)"
          git pull --rebase
          git push
